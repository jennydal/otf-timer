name: Daily OTF Timer Automation

on:
  schedule:
    # 9:00 AM UTC executes at exactly 5:00 AM EDT
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows you to click "Run Workflow" manually

permissions:
  contents: write

jobs:
  generate-timer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests google-genai

      - name: Run Generation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUSHCUT_WEBHOOK: ${{ secrets.PUSHCUT_WEBHOOK }}
        run: python generate_timer.py

      - name: Commit and Push File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today.seconds
          git commit -m "chore: update daily OTF template" || exit 0
          git push
